name: Refresh VHIS data

on:
  schedule:
    - cron: "0 2 3 * *" # 3rd of each month, 10:00 Hong Kong time
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Vercel even if the data did not change"
        type: boolean
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore premium PDF cache
        uses: actions/cache@v4
        with:
          path: .cache/pdfs
          key: vhis-pdfs-${{ github.run_id }}
          restore-keys: vhis-pdfs-

      - run: pip install -r pipeline/requirements.txt

      - name: Run pipeline (bronze → silver → quality gate → gold → publish)
        run: python -m pipeline.run

      - name: Keep quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: .lakehouse/reports/quality-report.json
          if-no-files-found: ignore

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "medsav-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data pipeline/history
          if git diff --cached --quiet -- public/data/premiums public/data/plans.csv pipeline/history; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset -q
          else
            git commit -m "data: VHIS refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' || inputs.deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
